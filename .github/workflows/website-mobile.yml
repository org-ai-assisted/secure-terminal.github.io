# AI-Assisted.
# Mandatory mobile-overflow gate: load every page in headless chromium at a
# phone viewport and fail if the body scrolls sideways. The check
# (check_mobile.py) lives in org-ai-assisted/dist-ai; website-tests treats a
# missing browser as a clean SKIP (correct on a dev box), so a dedicated lane is
# needed to REQUIRE the browser here -- dist-ai/ci/website-mobile-check.sh
# installs Playwright + chromium and turns a 77 SKIP into a hard failure.
name: website-mobile

on:
  push:
    branches: [master]
    paths:
      - '**/*.html'
      - 'style.css'
      - '.github/workflows/website-mobile.yml'
  pull_request:
    branches: [master]
    paths:
      - '**/*.html'
      - 'style.css'
      - '.github/workflows/website-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-mobile:
    # CI runs only where we enabled it. Unset variable -> the job is skipped, no
    # runner is allocated, and the run stays green: upstream and forks are never
    # handed a red X for a lane they did not opt into.
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    timeout-minutes: 20
    # ubuntu, not a slim container: Playwright 'install --with-deps chromium'
    # pulls the browser's OS packages, simplest on the GitHub-hosted image.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: site
          # The next step executes dist-ai's code in this workspace. Checkout
          # otherwise leaves this repo's GITHUB_TOKEN in .git/config, where that
          # foreign code could read it. Nothing here pushes.
          persist-credentials: false

      - name: Check out dist-ai (mobile guard + check_mobile.py)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: org-ai-assisted/dist-ai
          path: dist-ai
          persist-credentials: false

      - name: Mobile-overflow guard (mandatory)
        run: ./dist-ai/ci/website-mobile-check.sh "${GITHUB_WORKSPACE}/site"

      - name: Emit step summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          ./dist-ai/usr/bin/step-summary-emit \
            --tool 'website-mobile' \
            --column-header field \
            --row "outcome=${JOB_STATUS}"
